[package]
name = "magi-tokenizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# Apache-2.0 for the code; MIT for the bundled tiktoken vocabulary; Unicode-3.0 for the generated Unicode classes.
license = "Apache-2.0 AND MIT AND Unicode-3.0"
description = "Exact, fast o200k_base BPE tokenizer with build-time tables and a hand-written pretokenizer"
repository = "https://github.com/magimetal/magi-tokenizer"
include = ["/src", "/build.rs", "/assets", "/LICENSE", "/NOTICE", "/README.md"]

[lib]
name = "magi_tokenizer"

[features]
# Hooks for the bench/ differential harness (fallback counters, forced fallback, direct merge calls). Not a
# stable API; consumers should not enable it.
harness = []

[workspace]
members = ["bench"]
exclude = ["tools/gen-unicode"]

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

# The build script parses the vocabulary and builds hash tables; optimize it so builds stay quick.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
