[package]
name = "magi-tokenizer"
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
# Apache-2.0 for the code; MIT for the bundled tiktoken vocabularies; Unicode-3.0 for the generated Unicode classes.
license = "Apache-2.0 AND MIT AND Unicode-3.0"
description = "Exact, fast o200k_base, o200k_harmony and cl100k_base BPE tokenizer with build-time tables and hand-written pretokenizers"
repository = "https://github.com/magimetal/magi-tokenizer"
include = ["/src", "/build.rs", "/assets", "/LICENSE", "/NOTICE", "/README.md", "/CHANGELOG.md"]

[lib]
name = "magi_tokenizer"

[features]
# Hooks for bench/ memory measurements (fallback counters and forced fallback). Not a stable API;
# consumers should not enable it.
harness = []
# cl100k_base encoding (`magi_tokenizer::cl100k_base`). Its tables add about 10 MB to programs that call it;
# unused tables are dropped at link time.
cl100k_base = []

[workspace]
members = ["bench"]
exclude = ["tools/gen-unicode"]

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

# The build script parses the vocabulary and builds hash tables; optimize it so builds stay quick.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
