name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # verify runs the release build with overflow checks and debug assertions on.
  VERIFY: >-
    cargo run --release -p magi-tokenizer-bench
    --config profile.release.overflow-checks=true --config profile.release.debug-assertions=true

jobs:
  toolchains:
    name: build (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", "1.90.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build -p magi-tokenizer
      - run: cargo build -p magi-tokenizer --features harness

  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --release --workspace -- -D warnings
      - run: ${{ env.VERIFY }} -- verify
        shell: bash

  verify-i686:
    name: verify (i686 Linux, 32-bit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: ${{ env.VERIFY }} --target i686-unknown-linux-gnu -- verify

  verify-s390x:
    name: verify (s390x Linux, big-endian, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER: qemu-s390x -L /usr/s390x-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: s390x-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
      - run: ${{ env.VERIFY }} --target s390x-unknown-linux-gnu -- verify
