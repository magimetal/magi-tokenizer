[package]
name = "magi-tokenizer-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
magi-tokenizer = { path = "./..", features = ["harness"] }
bpe-openai = "=0.3.2"
tiktoken-rs = "=0.12.0"
fancy-regex = "=0.17.0"
regex = "=1.12.4"
regex-syntax = "=0.8.11"
serde_json = "1"
# Same versions tiktoken-rs uses: the reference merge passes an FxHashMap to `byte_pair_split`.
rustc-hash = "=2.1.3"
base64 = "=0.22.1"
